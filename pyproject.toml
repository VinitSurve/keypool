[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keypool"
version = "5.0.0"
description = "Universal AI credential management, local AI gateway, and developer infrastructure platform for macOS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "KEYPOOL Engineering" }
]
keywords = ["cli", "credentials", "keychain", "macos", "groq", "gemini", "api-keys"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<16.0.0",
    "keyring>=25.0.0,<26.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "cryptography>=42.0.0,<51.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<3.0.0",
    "build>=1.0.0,<2.0.0",
]

[project.scripts]
keypool = "keypool.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keypool = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "keychain: marks tests that interact with the real macOS Keychain",
    "live_provider: marks optional live provider tests using real configured credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",   # Line length handled by formatter / readable strings
    "B008",   # Typer uses function calls in argument defaults
    "S101",   # Assert used in tests
    "S603",   # Intentional controlled subprocess execution in execution_manager
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107", "S108"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["keypool"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "tomli_w.*",
]
ignore_missing_imports = true
